<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MUB 2027 · Plano de Mídia B2B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* V5 · contemporary executive. One sans family (Geist), hierarchy by weight/size/space.
   Porcelain leads, editorial black for type, bronze only for state and one detail per slide.
   Fixed 1920×1080 stage; slides can carry "builds" (progressive steps). Single light theme + one ink slide. */
:root{
  --porcelain:#F7F5F0;--white:#FFFFFF;--ink:#242424;--stone:#DCD5C9;--hair:#E5DFD5;--bronze:#9B8056;--bronze-ink:#7A6440;--bronze-soft:#C2A577;
  --muted:#6B665F;--soft:#45413B;--faint:#A39C91;--frame:#ECE8E0;
  --sans:'Geist','Helvetica Neue',Arial,sans-serif;--ease:cubic-bezier(.22,.61,.24,1);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--frame);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body.is-static{overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
i,em{font-style:normal}
.fn-c,.ar-c,.op-s,.cn-row,.ed-it{align-self:start}.li-c,.ab-c{align-self:flex-start}
:focus-visible{outline:2px solid var(--bronze);outline-offset:4px}
#root{height:100%}
.tab{font-variant-numeric:tabular-nums}

/* stage */
.viewport{position:fixed;inset:0;overflow:hidden;background:var(--frame)}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--porcelain);overflow:hidden;transform-origin:center}
.slide{position:absolute;inset:0;background:var(--porcelain);opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility 0s linear .8s}
.slide.on{opacity:1;visibility:visible;transition:opacity .8s var(--ease),visibility 0s}
.slide.ink{background:var(--ink);color:var(--porcelain)}
.slide.on .rv{animation:rv 1s var(--ease) both;animation-delay:calc(var(--i,0) * 110ms + 200ms)}
@keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fd .55s var(--ease) both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* shared type */
.folio{position:absolute;left:160px;right:160px;top:64px;display:flex;justify-content:space-between;font:500 16px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#8C857A}
.ink .folio{color:#8C857A}
.kick{font:500 18px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ink .kick{color:#A39C91}
.ttl{font:500 56px/1.08 var(--sans);letter-spacing:-.03em;margin-top:18px;text-wrap:balance}
.head{position:absolute;left:160px;top:176px;right:160px}
.lbl{font:500 17px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.note{font:400 18px/1.5 var(--sans);color:var(--muted)}
.fine{position:absolute;left:160px;bottom:64px;font:400 18px/1.5 var(--sans);color:var(--faint)}
.lnk{font:500 18px var(--sans);color:var(--muted);border-bottom:1px solid var(--stone);padding-bottom:3px;transition:color .2s,border-color .2s}
.lnk:hover{color:var(--ink);border-color:var(--bronze)}

/* navigation, nearly invisible */
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:20}
.prog i{display:block;height:100%;background:var(--bronze);opacity:.6;transition:width .8s var(--ease)}
.ctrl{position:absolute;right:160px;bottom:26px;display:flex;gap:4px;align-items:center;z-index:21;opacity:0;transition:opacity .5s;font:500 16px var(--sans);color:var(--muted)}
.awake .ctrl,.ctrl:focus-within{opacity:1}
.ctrl button{padding:8px 12px;border-radius:4px;transition:color .2s,background .2s}
.ctrl button:hover{color:var(--ink);background:rgba(155,128,86,.1)}
.ctrl .sep{width:1px;height:14px;background:var(--stone);margin:0 6px}
.tone-ink .ctrl{color:#A39C91}.tone-ink .ctrl button:hover{color:var(--porcelain)}
.overlay{position:absolute;inset:0;z-index:30;background:rgba(247,245,240,.97);padding:64px 160px;animation:fd .35s var(--ease) both}
.overlay .top{display:flex;justify-content:space-between;font:500 16px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.overlay h2{font:500 56px/1 var(--sans);letter-spacing:-.03em;margin-top:120px}
.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 80px;margin-top:56px}
.chs .cn{font:500 16px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bronze-ink)}
.chs .ct{font:500 30px var(--sans);letter-spacing:-.02em;margin:10px 0 14px}
.chs button{display:flex;gap:18px;font:400 21px/1.3 var(--sans);color:var(--soft);padding:8px 0;width:100%;border-top:1px solid var(--hair)}
.chs button span{color:var(--faint);width:30px}
.chs button.cur{color:var(--ink);font-weight:500}
.keys{position:absolute;left:160px;bottom:64px;font:400 18px var(--sans);color:var(--muted);display:flex;gap:36px}
.keys b{font-weight:600;color:var(--ink)}
.notes{position:absolute;left:0;right:0;bottom:0;z-index:25;background:rgba(247,245,240,.97);border-top:1px solid var(--stone);padding:28px 160px 64px;max-height:420px;overflow:auto;animation:fd .3s var(--ease) both}
.notes p{font:400 22px/1.6 var(--sans);color:var(--soft);max-width:1300px}
.notes .lbl{margin-bottom:10px}

/* 01 capa */
.cv-ph{position:absolute;left:960px;top:0;right:0;bottom:0;overflow:hidden;margin:0}
.cv-ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.03)}
.slide.on .cv-ph img{animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1)}}
.cv-logo{position:absolute;left:160px;top:72px;height:50px}
.cv-t{position:absolute;left:160px;bottom:170px;width:760px}
.cv-t h1{font:300 150px/.88 var(--sans);letter-spacing:-.06em;white-space:nowrap}
.cv-t h2{font:500 44px/1.15 var(--sans);letter-spacing:-.025em;margin-top:44px}
.cv-t p{display:flex;align-items:center;gap:18px;font:500 18px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:30px}
.cv-t p i{display:block;width:44px;height:1px;background:var(--bronze)}

/* 02 desafio */
.dz-msg{position:absolute;left:160px;top:250px;width:1500px}
.dz-msg .a{font:500 84px/1.04 var(--sans);letter-spacing:-.04em}
.dz-msg .b{font:300 84px/1.04 var(--sans);letter-spacing:-.04em;color:var(--soft);margin-top:6px}
.dz-flow{position:absolute;left:160px;right:160px;top:590px}
.dz-line{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--hair)}
.dz-line i{display:block;height:1px;background:var(--ink);width:0;transition:width 2.4s var(--ease) .8s}
.slide.on .dz-line i,.is-static .dz-line i{width:100%}
.dz-pts{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr auto}
.dz-pt span{display:block;width:19px;height:19px;border-radius:50%;background:var(--porcelain);border:1px solid var(--ink)}
.dz-pt p{font:500 30px var(--sans);letter-spacing:-.02em;margin-top:26px}
.dz-pt.end{text-align:right}
.dz-pt.end span{margin-left:auto;background:var(--bronze);border-color:var(--bronze)}
.dz-pt.end p{color:var(--bronze-ink)}
.dz-sub{position:absolute;left:160px;top:750px;font:400 26px/1.5 var(--sans);color:var(--muted);max-width:900px}

/* 03 ativos */
.at-ph{position:absolute;left:0;top:0;width:600px;height:1080px;overflow:hidden;margin:0}
.at-ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.03)}
.at .folio{left:720px}
.at-head{position:absolute;left:720px;top:176px;right:160px}
.at-hero{position:absolute;left:720px;top:384px}
.at-hero .v{font:300 210px/.86 var(--sans);letter-spacing:-.06em}
.at-hero .v small{font-size:96px;letter-spacing:-.04em;margin-left:10px}
.at-hero .t{font:400 24px var(--sans);color:var(--soft);margin-top:20px}
.at-two{position:absolute;left:720px;right:160px;top:690px;display:grid;grid-template-columns:1fr 1fr;gap:48px;border-top:1px solid var(--stone);padding-top:26px}
.at-two .v{font:300 92px/.9 var(--sans);letter-spacing:-.05em}
.at-two .v small{font-size:52px;margin-left:6px}
.at-two .t{font:400 22px var(--sans);color:var(--soft);margin-top:14px}
.at-more{position:absolute;left:720px;right:160px;top:690px;padding-top:26px;border-top:1px solid var(--stone);display:grid;grid-template-columns:repeat(5,1fr);gap:28px}
.at-more .v{font:400 44px/1 var(--sans);letter-spacing:-.03em}
.at-more .t{font:400 18px/1.4 var(--sans);color:var(--muted);margin-top:10px}
.at-foot{position:absolute;left:720px;right:160px;bottom:64px;display:flex;justify-content:space-between;align-items:baseline;gap:40px}.at-foot .lnk{white-space:nowrap}

/* 04 estratégia (ink) */
.st{position:absolute;left:160px;right:160px;top:230px}
.st-row{display:grid;grid-template-columns:90px 1fr auto;align-items:baseline;padding:30px 0 26px;border-top:1px solid #3A3631}
.st-row:last-child{border-bottom:1px solid #3A3631}
.st-row .ix{font:500 18px var(--sans);letter-spacing:.14em;color:var(--bronze-soft)}
.st-row h2{font:500 80px/1 var(--sans);letter-spacing:-.045em}
.st-row .s{font:400 22px var(--sans);color:#B8B1A6;margin-top:14px}
.st-row .q{font:500 18px var(--sans);color:#C9C2B6;border-bottom:1px solid #5A564F;padding-bottom:3px;align-self:center}
.st-row .q:hover,.st-row .q[aria-expanded="true"]{color:var(--porcelain);border-color:var(--bronze-soft)}
.st-def{margin-top:18px;font:400 24px/1.5 var(--sans);color:var(--porcelain);max-width:1080px;padding-left:20px;border-left:2px solid var(--bronze-soft)}

/* 05 funil */
.fn{position:absolute;left:160px;right:160px;top:400px}
.fn-track{position:absolute;left:0;right:0;top:0;height:1px;background:var(--hair)}
.fn-track i{display:block;height:2px;margin-top:-.5px;background:var(--ink);transition:width .7s var(--ease)}
.fn-cols{display:grid;grid-template-columns:repeat(4,1fr)}
.fn-c{position:relative;padding:40px 48px 0 0;transition:opacity .6s var(--ease)}
.fn-c.off{opacity:.22}
.fn-c .dot{position:absolute;left:0;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--porcelain);border:1px solid var(--ink);transition:background .4s,border-color .4s}
.fn-c.cur .dot{background:var(--bronze);border-color:var(--bronze)}
.fn-c .n{font:500 18px var(--sans);letter-spacing:.14em;color:var(--faint)}
.fn-c .k{font:600 30px var(--sans);letter-spacing:.06em;margin-top:14px}
.fn-c .o{font:400 28px/1.3 var(--sans);color:var(--soft);margin-top:16px;max-width:340px}
.fn-c .c{font:400 19px/1.5 var(--sans);color:var(--muted);margin-top:20px;max-width:330px}
.fn-c:hover:not(.off){opacity:1}
.fn-fun{position:absolute;left:160px;right:160px;top:800px;border-top:1px solid var(--stone);padding-top:24px;display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:baseline}
.fn-fun p{font:400 22px/1.5 var(--sans);color:var(--muted)}.fn-fun p.lbl{font:500 16px var(--sans);letter-spacing:.16em;color:var(--muted)}

/* 06 arquitetura */
.ar{position:absolute;left:160px;right:160px;top:430px}
.ar-line{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--hair)}
.ar-line i{display:block;height:1px;background:var(--ink);transition:width .9s var(--ease)}
.ar-run{position:absolute;top:4px;width:13px;height:13px;border-radius:50%;background:var(--bronze);transition:left .9s var(--ease)}
.ar-cols{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.ar-c{padding:52px 60px 0 0;transition:opacity .6s var(--ease)}
.ar-c.off{opacity:.2}
.ar-c .n{font:500 18px var(--sans);letter-spacing:.14em;color:var(--faint)}
.ar-c h3{font:600 40px/1.1 var(--sans);letter-spacing:.02em;margin-top:18px}
.ar-c p{font:400 28px/1.35 var(--sans);color:var(--soft);margin-top:18px;max-width:420px}
.ar-tick{position:absolute;top:0;width:21px;height:21px;border-radius:50%;background:var(--porcelain);border:1px solid var(--ink)}

/* 07 canais */
.cn-l{position:absolute;left:160px;right:160px;top:400px}
.cn-hd{display:flex;justify-content:space-between;margin-bottom:16px}
.cn-r{position:absolute;left:1300px;right:160px;top:410px}
.cn-row{display:grid;grid-template-columns:400px 1fr 300px;align-items:center;gap:48px;padding:24px 0;border-top:1px solid var(--hair);width:100%;transition:opacity .4s var(--ease)}
.cn-l .rows:hover .cn-row:not(:hover){opacity:.45}
.cn-row .nm{font:500 24px var(--sans);letter-spacing:-.01em;color:var(--soft)}
.cn-row.p1 .nm{font-size:38px;color:var(--ink);letter-spacing:-.03em}
.cn-row.p2 .nm{font-size:30px;color:var(--ink);letter-spacing:-.02em}
.cn-row.p4 .nm{color:var(--muted)}
.cn-row .bar{height:6px;background:var(--hair);position:relative}
.cn-row .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width 1.2s var(--ease)}
.cn-row.p1 .bar i{background:var(--bronze)}.cn-row.p1{padding:26px 0}.cn-row.p1 .bar,.cn-row.p2 .bar{height:8px}
.cn-row .bar.dash{background:none;border-top:1px dashed var(--stone);height:0}
.cn-row .v{font:300 48px/1 var(--sans);text-align:right;color:var(--soft);letter-spacing:-.04em}.cn-row.p4 .v{font:400 20px var(--sans);letter-spacing:0;color:var(--muted)}
.cn-row.p1 .v{font-size:104px;color:var(--ink);letter-spacing:-.06em}.cn-row.p2 .v{font-size:72px;color:var(--ink);letter-spacing:-.05em}
.cn-det{margin-top:26px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;min-height:96px}
.cn-det p.t{font:400 22px/1.45 var(--sans);color:var(--ink);margin-top:8px}
.cn-tot{position:absolute;left:160px;width:1000px;top:916px}
.cn-tot .bar{display:flex;gap:3px;height:8px}
.cn-tot .bar i{display:block;flex-basis:0}
.cn-tot .bar i.rsv{border:1px dashed var(--bronze);background:transparent}
.cn-tot .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;gap:40px}.cn-tot .row + .row{margin-top:4px}.cn-tot .row.sub p{font-size:18px;color:var(--muted)}
.cn-tot .row p{font:400 20px var(--sans);color:var(--soft)}
.cn-tot .row p b{font-weight:600;color:var(--ink)}
.cn-tot .row p.r{text-align:right}
.cn-tot .row p.r b{color:var(--bronze-ink)}
.cn-tot .row span{color:var(--muted)}
.cn-r .it{padding:22px 0;border-top:1px solid var(--hair)}
.cn-r .it b{display:block;font:400 26px var(--sans);letter-spacing:-.01em;color:var(--soft)}
.cn-r .it span{display:block;font:400 19px/1.4 var(--sans);color:var(--muted);margin-top:4px}

/* 08 linkedin */
.li{position:absolute;left:160px;right:160px;top:390px;display:flex;gap:6px}
.li-c{padding:0 32px 0 0;transition:opacity .4s var(--ease)}
.li-c .tl{display:block;height:2px;background:var(--stone);margin-bottom:26px;transition:background .4s}
.li-c[aria-pressed="true"] .tl{background:var(--bronze)}
.li-c[aria-pressed="false"]{opacity:.42}
.li-c[aria-pressed="false"]:hover{opacity:.75}
.li-c .k{font:500 18px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.li-c .nm{font:500 34px var(--sans);letter-spacing:-.02em;margin-top:12px}
.li-c .p{font:300 128px/.9 var(--sans);letter-spacing:-.06em;margin-top:26px}
.li-c .v{font:400 22px var(--sans);color:var(--soft);margin-top:16px}
.li-d{position:absolute;left:160px;right:160px;top:770px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px;border-top:1px solid var(--stone);padding-top:24px}
.li-d p.t{font:400 19px/1.5 var(--sans);color:var(--muted);margin-top:8px}.li-d .lbl{font-size:16px}

/* 09 editorial */
.ed-l{position:absolute;left:160px;top:372px;width:900px}
.ed-it{display:grid;grid-template-columns:70px 1fr;align-items:baseline;padding:22px 0;border-top:1px solid var(--hair);width:100%;transition:opacity .4s}
.ed-it .n{font:500 18px var(--sans);letter-spacing:.14em;color:var(--faint)}
.ed-it .nm{font:400 40px/1.1 var(--sans);letter-spacing:-.03em;color:var(--muted);transition:color .3s,font-size .4s var(--ease)}
.ed-it[aria-pressed="true"] .nm{color:var(--ink);font-weight:500}
.ed-it.first .nm{font-size:64px}
.ed-it[aria-pressed="true"] .n{color:var(--bronze-ink)}
.ed-it .r{display:block;font:400 18px var(--sans);color:var(--muted);margin-top:8px;letter-spacing:0}
.ed-d{position:absolute;left:1180px;right:160px;top:388px}
.ed-d .rl{font:500 18px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bronze-ink)}
.ed-d h3{font:500 40px/1.1 var(--sans);letter-spacing:-.03em;margin-top:18px}
.ed-d p{font:400 24px/1.5 var(--sans);color:var(--soft);margin-top:20px}

/* 10 abm */
.ab{position:absolute;left:160px;right:160px;top:390px;display:flex;gap:6px}
.ab-c{padding:0 28px 0 0;transition:opacity .4s var(--ease)}
.ab-c .tl{display:block;height:2px;background:var(--stone);margin-bottom:24px;transition:background .4s}
.ab-c[aria-pressed="true"] .tl{background:var(--bronze)}
.ab-c[aria-pressed="false"]{opacity:.4}
.ab-c[aria-pressed="false"]:hover{opacity:.75}
.ab-c .k{font:500 18px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ab-c .n{font:300 150px/.86 var(--sans);letter-spacing:-.06em;margin-top:22px}
.ab-c .a{font:500 24px var(--sans);margin-top:18px}
.ab-c .a span{font-weight:400;color:var(--muted)}
.ab-d{position:absolute;left:160px;right:160px;top:770px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;border-top:1px solid var(--stone);padding-top:24px}
.ab-d p.t{font:400 23px/1.45 var(--sans);margin-top:10px}

/* 11 operação */
.op{position:absolute;left:160px;right:160px;top:450px}
.op-line{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--hair)}
.op-line i{display:block;height:1px;background:var(--ink);transition:width .7s var(--ease)}
.op-cols{position:relative;display:grid;grid-template-columns:repeat(6,1fr)}
.op-s{padding-right:20px;transition:opacity .5s var(--ease);width:100%}
.op-s.off{opacity:.2}
.op-s .d{display:block;width:19px;height:19px;border-radius:50%;background:var(--porcelain);border:1px solid var(--ink);transition:background .4s,border-color .4s}
.op-s.cur .d{background:var(--bronze);border-color:var(--bronze)}
.op-s .n{font:500 16px var(--sans);letter-spacing:.14em;color:var(--faint);margin-top:28px}
.op-s .k{font:500 32px var(--sans);letter-spacing:-.02em;margin-top:10px}
.op-s .t{font:400 20px/1.4 var(--sans);color:var(--muted);margin-top:12px}
.op-sum{position:absolute;left:160px;right:160px;top:780px;border-top:1px solid var(--stone);padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:60px}
.op-sum p.t{font:400 19px/1.5 var(--sans);color:var(--muted);margin-top:8px}.op-sum .lbl{font-size:16px}

/* 12 simulador */
.sm-l{position:absolute;left:160px;top:330px;width:900px}
.sm-amt{font:300 168px/.86 var(--sans);letter-spacing:-.06em}
.sm-cap{font:400 22px var(--sans);color:var(--muted);margin-top:22px}
.sm-range{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;cursor:pointer;margin-top:36px}
.sm-range::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--ink) 0 var(--p),var(--stone) var(--p) 100%)}

let REDUCE=false;try{REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
const Ctx=createContext({active:false,isStatic:false,step:0,setStep:()=>{}});
const R=i=>({'--i':i});
const brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const pct=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
function useOn(){const c=useContext(Ctx);return c.active||c.isStatic}
function useTween(target,{dur=1100,delay=250}={}){
  const {active,isStatic}=useContext(Ctx);const [v,setV]=useState(target);const cur=useRef(target),was=useRef(false);
  useEffect(()=>{if(isStatic||REDUCE){cur.current=target;setV(target);return}
    if(!active){was.current=false;return}
    const from=was.current?cur.current:0,d=was.current?0:delay;was.current=true;if(from===target){setV(target);return}
    setV(from);let raf,st=null;const tick=t=>{if(st===null)st=t;const p=Math.min(1,(t-st)/dur),e=1-Math.pow(1-p,3),x=from+(target-from)*e;cur.current=x;setV(x);if(p<1)raf=requestAnimationFrame(tick)};
    const to=setTimeout(()=>{raf=requestAnimationFrame(tick)},d);return()=>{clearTimeout(to);cancelAnimationFrame(raf)}},[active,target,isStatic]);
  return v;
}
function Num({v,dec=0,pre='',suf='',delay,dur}){const x=useTween(v,{delay,dur});return html`<span className="tab">${pre}${x.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})}${suf}</span>`}
const Folio=()=>{const c=useContext(Ctx);return html`<div className="folio rv" style=${R(0)}><span>${c.chap||''}</span><span className="tab">${c.num||''}</span></div>`};
const Head=({k,t,cls})=>html`<div className=${'head '+(cls||'')}><p className="kick rv" style=${R(1)}>${k}</p><h2 className="ttl rv" style=${R(2)}>${t}</h2></div>`;

   ABM is internal; production/support (landing page, materials) is outside this budget.
   Media lines + strategic reserve only. Totals: 20.000 / 35.000 / 50.000. */
const SIM=[
 {n:'LinkedIn Ads',c:'#235B78',g:0,a:[12000,18000,26000]},
 {n:'Mídia editorial / PR',c:'#C29A53',g:0,a:[3000,8000,12000]},
 {n:'Meta Remarketing',c:'#7B83A0',g:0,a:[2000,4000,5000]},
 {n:'Google Search',c:'#7BA9A0',g:0,a:[0,2000,2000]},
 {n:'Reserva estratégica',c:'#88846C',g:1,a:[3000,3000,5000]}];
const GROUPS=['Mídia e distribuição','Reserva estratégica'];
function allocate(total){const ix=total<=35000?0:1,s=ix?35000:20000,e=ix?50000:35000,t=(total-s)/(e-s);const raw=SIM.map(x=>x.a[ix]+(x.a[ix+1]-x.a[ix])*t);const r=raw.map(x=>Math.floor(x/10)*10);let rem=total-r.reduce((a,b)=>a+b,0);const fr=raw.map((x,i)=>({i,f:x-r[i]})).sort((a,b)=>b.f-a.f);for(let k=0;k<rem/10;k++)r[fr[k%fr.length].i]+=10;return r}

 {k:'Horizontal',e:'Landscape',r:'1,91:1',px:'1200 × 628 px',a:'Sponsored Content com imagem única, para desktop e mobile.',w:1.91,st:1},
 {k:'Quadrado',e:'Square',r:'1:1',px:'1200 × 1200 px',a:'Sponsored Content com imagem única, para desktop e mobile.',w:1,st:0},
 {k:'Vertical',e:'Portrait',r:'4:5',px:'720 × 900 px',a:'Sponsored Content com imagem única, voltado à entrega mobile.',w:.8,st:1},
 {k:'Carrossel estático',e:'Carousel',r:'1:1 por cartão',px:'Mín. 1080 × 1080 px',q:'2 a 10 cartões',a:'Narrativa visual sequencial: diferentes ativos, possibilidades de associação e oportunidades comerciais.',car:1,st:0}];
const LH=280,CW=226;
function Pack(){const [sel,setSel]=useState(0);const F=LIF[sel];
  return html`<${Folio}/>
  <${Head} k="Campanha e peças publicitárias" t="Formatos estáticos LinkedIn"/>
  <div className="lf rv" style=${R(3)} role="group" aria-label="Formatos LinkedIn">
    ${LIF.map((f,i)=>html`<button key=${f.k} className=${'lf-it'+(f.st?'':' dev')} aria-pressed=${sel===i} onClick=${()=>setSel(i)} onMouseEnter=${()=>setSel(i)} onFocus=${()=>setSel(i)}>
      ${f.car?html`<div className="lf-car" style=${{height:LH+'px'}}>${[1,2].map(c=>html`<span key=${c} className="lf-fr" style=${{width:CW+'px',height:CW+'px',left:(c-1)*(CW+14)+'px'}}><b className="tab">${c}</b></span>`)}<span className="lf-dots" aria-hidden="true"><i className="on"></i><i></i><i></i><i></i></span></div>`
        :html`<span className="lf-fr" style=${{width:Math.round(LH*f.w)+'px',height:LH+'px'}}><b className="tab">${f.r}</b></span>`}
      <span className="lf-cap"><span className="n tab">0${i+1}</span>${f.k}</span>
    </button>`)}
  </div>
  <div className="lf-det rv" style=${R(4)}>
    <div key=${'a'+sel} className="fade"><p className="lbl tab">0${sel+1} · ${F.e}</p><p className="k">${F.k}</p><span className=${'stt'+(F.st?'':' dev')}><i></i>${F.st?'Peça pronta · original a inserir':'Adaptação a desenvolver'}</span></div>
    <div key=${'b'+sel} className="fade"><p className="lbl">Proporção</p><p className="v tab">${F.r}</p>${F.q?html`<p className="lbl" style=${{marginTop:'18px'}}>Quantidade</p><p className="v tab">${F.q}</p>`:null}</div>
    <div key=${'c'+sel} className="fade"><p className="lbl">Resolução recomendada</p><p className="v tab">${F.px}</p></div>
    <div key=${'d'+sel} className="fade"><p className="lbl">Aplicação</p><p className="t">${F.a}</p></div>
  </div>`}
function Gif({cls,v,u,l,w,h}){return html`<div className=${'gif '+(cls||'')} style=${{width:w+'px',height:h+'px'}}><img className="lg" src=${IMG.logo} alt=""/><p className="nb tab">${v}${u?html`<small>${u}</small>`:null}</p><p className="lb">${l}</p><span className="rl"></span></div>`}
function Gifs(){return html`<${Folio}/>
  <${Head} k="Campanha e peças publicitárias" t="GIFs com big numbers"/>
  <span className="stt dev hd-st rv" style=${R(2)}><i></i>Em desenvolvimento · conceito</span>
  <div className="gf">
    <div className="gf-l">
      <div className="rv" style=${R(3)}><${Gif} v="78" u="milhões" l="de visualizações em 30 dias" w=${1214} h=${250}/><p className="gf-cap"><b>Horizontal</b> · banner</p></div>
      <div className="gf-row">
        <div className="rv" style=${R(4)}><${Gif} v="533" l="influenciadoras no ecossistema" w=${300} h=${250}/><p className="gf-cap"><b>Outras posições</b> · adaptação</p></div>
        <p className="note rv" style=${{'--i':6,maxWidth:'600px',paddingBottom:'44px'}}>Movimento suave e curto, número como protagonista. Dimensões finais conforme especificações de cada veículo e plataforma. Indicadores do material comercial MUB, sujeitos à validação.</p>
      </div>
    </div>
    <div className="rv" style=${R(5)}><${Gif} cls="lt" v="2,8" u="milhões" l="de espectadores na TV aberta" w=${330} h=${540}/><p className="gf-cap"><b>Vertical</b></p></div>
  </div>`}

/* V6 · ativação D+1 */
function Ativacao(){return html`<${Folio}/>
  <${Head} k="Proposta de ativação" t="Ativação D+1 · Marcella Top 10"/>
  <div className="dp">
    <div className="dp-b rv" style=${R(3)}><p className="d tab">Dia 24</p><p className="t">Evento e confirmação do resultado</p></div>
    <div className="dp-ln rv" style=${R(4)}><i></i><b></b></div>
    <div className="dp-b on rv" style=${R(5)}><p className="d tab">Dia 25</p><p className="t">Início da ativação D+1</p><p className="s">Condicionado à confirmação oficial do Top 10</p></div>
    <div className="dp-ln lt rv" style=${R(6)}><i></i><b></b></div>
    <div className="dp-b sm rv" style=${R(7)}><p className="d tab">D+2</p><p className="t">Integração ao plano de 60 dias</p></div>
  </div>
  <div className="dp-act rv" style=${R(8)}><p className="lbl">Possibilidades no Dia 25</p>
    <p className="t">Filmes comerciais · banners e estáticos · conteúdo editorial, se disponível · reforço em canais digitais</p></div>`}

/* ---------- speaker notes (methodology lives here, off-screen) ---------- */
const NT={
 cover:'Abertura. Proposta de investimento em marketing B2B para apoiar a captação de patrocínios, em 60 dias, com cenários de R$ 20 mil a R$ 50 mil. Não é um deck para vender cotas aos anunciantes.',
 desafio:'Contexto: as cotas do material comercial são referenciais (Master R$ 1 milhão, Premium R$ 600 mil, VIP R$ 400 mil; pp. 20–23, ainda citadas como 2026). Ticket elevado, vários influenciadores na decisão e ciclo longo: a mídia apoia a prospecção, não substitui a venda. Compramos precisão, não volume.',
 ativos:'Destaques: 78 milhões de visualizações em 30 dias, 2,8 milhões de espectadores na TV aberta e 533 influenciadoras. Outros: 27 concursos estaduais, mais de 500 municipais e regionais, 2,2 milhões de seguidores somados das finalistas, 8 meses de campanha e 12 experiências no calendário. Todos vêm do material comercial do MUB (pp. 11–19) e precisam de validação de fonte, período, escopo e direitos antes de uso em anúncios. Não misturamos métricas globais do Miss Universe.',
 estrategia:'Três pilares: autoridade gera confiança; ABM encontra as contas certas; a operação comercial transforma interesse em negociação. A frente comercial do projeto é liderada por Gustavo Sarti (G/Sarti Consultoria); a mídia opera integrada a ela.',
 funil:'Quatro etapas. A mídia não vende a cota sozinha: aumenta a credibilidade e apoia a atuação comercial. Use as setas para avançar etapa por etapa.',
 arq:'Mídia lidera exposição (LinkedIn, editorial e conteúdo); inteligência comercial (ABM e CRM) identifica 2–3 decisores por empresa e registra valor potencial e origem; equipe comercial conduz reunião, proposta e negociação. Jornada multitoque: nenhuma reunião é atribuída exclusivamente ao anúncio.',
 canais:'Percentuais calculados só sobre a verba de mídia do cenário-base (R$ 32 mil): LinkedIn 56% (R$ 18 mil), editorial/PR 25% (R$ 8 mil), Meta 13% (R$ 4 mil), Google 6% (R$ 2 mil); soma 100%. Programática é opcional, sem verba prevista. A reserva estratégica (R$ 3 mil) fica fora da verba de mídia. Funções: LinkedIn é a principal mídia paga; editorial/PR dá credibilidade (após cotação); Meta faz reforço para quem já teve contato (só com audiência suficiente); Google capta demanda existente (teste). ABM, CRM e equipe comercial não são mídia paga.',
 linkedin:'A lista ABM comercial é muito menor que a audiência paga: 80 empresas sozinhas não dão escala. Controlar público mínimo e entrega. KPIs gerais: tráfego qualificado, engajamento, leads qualificados e reuniões influenciadas. Percentuais sobre a verba de LinkedIn Ads (R$ 18 mil no cenário-base): Campanha A R$ 10.800, Campanha B R$ 7.200. Audiências e formatos são hipóteses sujeitas à validação com a operação de mídia.',
 editorial:'Formatos: publieditorial identificado, distribuição em newsletter e social do veículo, RP orgânica quando viável. Critérios: audiência executiva, alcance, links, provas de distribuição e custo, não prestígio isolado. Nenhuma contratação confirmada: os investimentos dependem de cotação, aprovação, viabilidade financeira e adequação da audiência. Nenhum valor é comprometido antes da proposta formal do veículo. Publicação paga nunca é apresentada como cobertura jornalística espontânea. V6: Adnews entra como quarta alternativa para avaliação. Os quatro veículos são alternativas de negociação, sem valores, disponibilidade ou formatos confirmados.',
 abm:'Setores candidatos: beleza, moda, tecnologia, serviços financeiros, turismo e hospitalidade, varejo e consumo. Pontuação de 0 a 5 em afinidade de marca, histórico de patrocínio, capacidade financeira, adequação de contrapartidas e acesso a decisores. Os nomes de abordagem por tier são sugestão, a validar com a equipe comercial. Metodologia integrada à equipe comercial, sem custo de mídia. Empresas são hipóteses a pesquisar, não patrocinadores confirmados.',
 operacao:'Cada reunião registrada no CRM com estágio, valor potencial e origem dos pontos de contato. Atribuição indicativa, sem promessa de precisão perfeita. Execução depende de SLAs entre marketing e comercial.',
 sim:'Distribuição aprovada, válida para o investimento total em 60 dias: R$ 20 mil → LinkedIn 12.000, editorial 3.000, Meta 2.000, Google 0, reserva 3.000. R$ 35 mil → 18.000, 8.000, 4.000, 2.000, 3.000. R$ 50 mil → 26.000, 12.000, 5.000, 2.000, 5.000. Mídia no cenário-base: R$ 32 mil; reserva estratégica de R$ 3 mil, não comprometida, disponível para otimizações. ABM é operação interna. Landing page, materiais comerciais e infraestrutura continuam necessários, mas não estão previstos nesta verba: dependem de estrutura interna ou orçamento separado. Cenários exploratórios, sujeitos a cotações e capacidade operacional; valores intermediários interpolados. No cenário enxuto, evitar pulverização de canais. Não inclui honorários gerais.',
 road:'Horizonte de 60 dias em quatro fases de 15 dias, com checkpoints de mídia e comercial em D15, D30, D45 e D60. O orçamento total de cada cenário vale para os 60 dias; o ritmo de investimento por fase será definido na execução, sem redução proporcional. Ajustes entre fases condicionados aos dados.',
 res:'Os indicadores foram projetados para um horizonte mais longo e ainda não foram recalibrados para os 60 dias: tratar como referências preliminares, sujeitas à validação da equipe comercial. Indicadores operacionais hipotéticos, não garantia nem benchmark externo. KPI de negócio: valor do pipeline e patrocínios fechados, sem meta de quantidade de cotas vendidas. Antes de fixar metas, validar baseline, capacidade comercial, definição de reunião qualificada, ciclo de venda e valores finais das cotas, com Gustavo Sarti e a direção do MUB.',
 fim:'Encerramento. Próximo passo: aprovar o cenário de investimento e iniciar os 60 dias, depois de validar métricas, valores das cotas, SLAs e CRM.',
 clusters:'Clusters são públicos estratégicos de comunicação: quem queremos impactar com campanhas, conteúdo e ativações institucionais. Não são divisões comerciais nem campanhas individuais. Os públicos se sobrepõem (uma diretora de marketing pode estar num anunciante e decidir patrocínios). O orçamento não é dividido entre clusters e não haverá seis campanhas no LinkedIn; a segmentação operacional será definida no MUB 2027 | Playbook Tático de LinkedIn Ads. Sem estimativas de alcance por cluster.',
 formatos:'Três formatos possíveis: banner (display desktop e mobile), branded content (conteúdo patrocinado com identificação adequada) e e-mail/newsletter. Os mockups são simulações conceituais, sem relação com layouts de veículos específicos. Nomenclatura, especificações, audiência e preços dependem das propostas de cada parceiro.',
 filmes:'Dois filmes comerciais originais, prontos, em formato vertical 9:16 (0:36 e 1:22). Reprodução sob demanda, sem início automático; o vídeo pausa ao trocar de slide. Na versão web, os arquivos foram comprimidos para publicação, mantendo enquadramento, proporção, duração e conteúdo. No PDF aparece um frame original de cada filme.',
 pack:'Quatro formatos estáticos previstos na documentação do LinkedIn Ads: horizontal 1,91:1 (1200 × 628 px), quadrado 1:1 (1200 × 1200 px), vertical 4:5 (720 × 900 px, entrega mobile) e carrossel com 2 a 10 cartões 1:1 (mínimo 1080 × 1080 px). O carrossel é um formato de anúncio com vários cartões, não uma quarta proporção de imagem única. Horizontal e vertical já foram produzidos e entram com os arquivos originais, sem alterações; quadrado e carrossel são adaptações a desenvolver. Os quadros são representações de proporção, não peças finais.',
 gifs:'Frente em desenvolvimento: propostas conceituais de GIFs com big numbers (78 milhões de visualizações em 30 dias, 2,8 milhões de espectadores na TV aberta, 533 influenciadoras). Números do material comercial, sujeitos à validação de fonte, período, escopo e direitos. Formatos prioritários: horizontais, verticais e adaptações; dimensões definitivas conforme especificações de veículos e plataformas.',
 ativacao:'Ativação D+1 condicionada à participação de Marcella entre as Top 10. Dia 24: evento e confirmação do resultado. Dia 25: início da ativação, somente após a confirmação oficial. A partir do D+2, a comunicação passa a integrar a execução do plano de mídia de 60 dias, seguindo as fases e checkpoints do cronograma, sem timeline paralela. Mês e ano a confirmar. Programação sujeita a aprovações criativas, disponibilidade dos veículos e orçamento previsto.'};

/* ---------- registry ---------- */
const SLIDES=[
 {C:Cover,t:'Capa',ch:0,nt:NT.cover},{C:Desafio,t:'O desafio',ch:0,nt:NT.desafio},{C:Ativos,t:'Ativos de marca',cls:'at',ch:0,nt:NT.ativos},
 {C:Estrategia,t:'Nossa estratégia',cls:'ink',ch:0,nt:NT.estrategia},{C:Funil,t:'A lógica do funil',ch:0,steps:4,nt:NT.funil},{C:Arquitetura,t:'Arquitetura operacional',ch:0,steps:3,nt:NT.arq},
 {C:Clusters,t:'Clusters estratégicos',ch:1,nt:NT.clusters},{C:Canais,t:'Ecossistema de canais',ch:1,nt:NT.canais},{C:LinkedIn,t:'LinkedIn Ads',ch:1,nt:NT.linkedin},{C:Editorial,t:'Mídia editorial',ch:1,nt:NT.editorial},{C:Formatos,t:'Formatos de ativação',ch:1,nt:NT.formatos},
 {C:Filmes,t:'Filmes comerciais',ch:2,nt:NT.filmes},{C:Pack,t:'Formatos estáticos LinkedIn',ch:2,nt:NT.pack},{C:Gifs,t:'GIFs com big numbers',ch:2,nt:NT.gifs},{C:ABM,t:'Account-Based Marketing',ch:2,nt:NT.abm},{C:Operacao,t:'Operação comercial',ch:2,steps:6,nt:NT.operacao},
 {C:Simulador,t:'Simulador de investimento',ch:3,nt:NT.sim},{C:Roadmap,t:'Plano de 60 dias',ch:3,nt:NT.road},{C:Resultados,t:'Resultados esperados',ch:3,nt:NT.res},
 {C:Ativacao,t:'Ativação D+1 · Marcella Top 10',ch:4,nt:NT.ativacao},{C:Fim,t:'Encerramento',ch:4,nt:NT.fim}];
const CHAPTERS=[['I','Contexto e estratégia'],['II','Públicos e canais'],['III','Criativos e inteligência comercial'],['IV','Investimento e execução'],['V','Ativação e encerramento']];
const N=SLIDES.length,pad=n=>String(n).padStart(2,'0');
function readHash(){const h=(location.hash||'').slice(1);if(h==='estatico')return{st:true,i:0};const m=h.match(/^slide-(\d+)$/);return{st:false,i:m?Math.min(N,Math.max(1,+m[1]))-1:0}}

function App(){
  const init=readHash(),PDF=!!window.__PDF__;
  const [isStatic,setStatic]=useState(PDF||init.st||(innerWidth<720&&!location.hash));
  const [cur,setCur]=useState(init.i),[step,setStep]=useState(0),[epoch,setEpoch]=useState(0),[menu,setMenu]=useState(false),[notes,setNotes]=useState(false);
  const [scale,setScale]=useState(1),[vw,setVw]=useState(innerWidth),[awake,setAwake]=useState(false);
  const st=useRef({cur,step});st.current={cur,step};
  const go=useCallback((i,back)=>{const n=Math.max(0,Math.min(N-1,i));setCur(n);setStep(back&&SLIDES[n].steps?SLIDES[n].steps-1:0);setMenu(false)},[]);
  const next=useCallback(()=>{const {cur,step}=st.current,S=SLIDES[cur];if(S.steps&&step<S.steps-1)setStep(step+1);else if(cur<N-1)go(cur+1)},[]);
  const prev=useCallback(()=>{const {cur,step}=st.current,S=SLIDES[cur];if(S.steps&&step>0)setStep(step-1);else if(cur>0)go(cur-1,true)},[]);
  const restart=useCallback(()=>{setEpoch(e=>e+1);go(0)},[]);
  const toggleFs=useCallback(()=>{try{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}},[]);
  useEffect(()=>{document.body.classList.toggle('is-static',isStatic);document.body.classList.toggle('pdf',PDF)},[isStatic]);
  useEffect(()=>{const f=()=>{setScale(Math.min(innerWidth/1920,innerHeight/1080));setVw(innerWidth)};f();addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
  useEffect(()=>{if(PDF)return;try{history.replaceState(null,'',isStatic?'#estatico':'#slide-'+(cur+1))}catch(e){}},[cur,isStatic]);
  useEffect(()=>{const f=()=>{const h=readHash();setStatic(h.st);if(!h.st)go(h.i)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
  useEffect(()=>{if(isStatic)return;const k=e=>{const tg=e.target,tag=tg&&tg.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey)return;const K=e.key;
    if(K==='ArrowRight'||K==='PageDown'||(K===' '&&tag!=='BUTTON'&&tag!=='VIDEO')){e.preventDefault();next()}
    else if(K==='ArrowLeft'||K==='PageUp'){e.preventDefault();prev()}
    else if(K==='Home'){e.preventDefault();go(0)}else if(K==='End'){e.preventDefault();go(N-1)}
    else if(K==='f'||K==='F')toggleFs();else if(K==='c'||K==='C')setMenu(m=>!m);else if(K==='n'||K==='N')setNotes(m=>!m);else if(K==='r'||K==='R')restart();else if(K==='Escape'){setMenu(false);setNotes(false)}};
    addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[isStatic]);
  useEffect(()=>{if(isStatic)return;let t;const w=()=>{setAwake(true);clearTimeout(t);t=setTimeout(()=>setAwake(false),2200)};addEventListener('mousemove',w);return()=>{clearTimeout(t);removeEventListener('mousemove',w)}},[isStatic]);
  useEffect(()=>{if(isStatic)return;let x0=null,y0=null;const s=e=>{if(e.target&&e.target.closest&&e.target.closest('video')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY};const en=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)(dx<0?next:prev)();x0=null};addEventListener('touchstart',s,{passive:true});addEventListener('touchend',en);return()=>{removeEventListener('touchstart',s);removeEventListener('touchend',en)}},[isStatic]);

  if(isStatic){const sc=PDF?1:Math.min(1,(Math.min(vw,1952)-32)/1920);
    return html`<div className="static-view"><div className="static-bar"><span><b>MUB 2027 · versão estática</b> · ${N} slides, com as notas do apresentador</span><button onClick=${()=>{setStatic(false);go(0)}}>Abrir modo apresentação</button></div>
      ${SLIDES.map((S,i)=>html`<${Fragment} key=${i}><div className="frame" style=${{height:(1080*sc)+'px'}}><div className="scaler" style=${{transform:'scale('+sc+')'}}>
        <${Ctx.Provider} value=${{active:true,isStatic:true,step:(S.steps||1)-1,setStep:()=>{},num:pad(i+1),chap:CHAPTERS[S.ch][0]+' · '+CHAPTERS[S.ch][1]}}><section className=${'slide on '+(S.cls||'')} aria-label=${'Slide '+(i+1)+': '+S.t}><${S.C}/></section><//></div></div>
        <p className="snote"><b>Notas · ${pad(i+1)}</b> — ${SLIDES[i].nt}</p><//>`)}</div>`}

  const ink=(SLIDES[cur].cls||'').includes('ink');
  return html`<div className=${'viewport'+(awake?' awake':'')}>
    <div className=${'stage'+(ink?' tone-ink':'')} style=${{transform:'translate(-50%,-50%) scale('+scale+')'}} role="region" aria-roledescription="apresentação" aria-label="MUB 2027 · Estratégia de Mídia & Patrocínios">
      <div key=${epoch} style=${{position:'absolute',inset:0}}>
        ${SLIDES.map((S,i)=>html`<${Ctx.Provider} key=${i} value=${{active:i===cur,isStatic:false,step:i===cur?step:0,setStep,num:pad(i+1),chap:CHAPTERS[S.ch][0]+' · '+CHAPTERS[S.ch][1]}}>
          <section className=${'slide '+(S.cls||'')+(i===cur?' on':'')} aria-hidden=${i!==cur} inert=${i!==cur?'':undefined} aria-label=${'Slide '+(i+1)+' de '+N+': '+S.t}><${S.C}/></section><//>`)}
      </div>
      <div className="prog" aria-hidden="true"><i style=${{width:((cur+1)/N*100)+'%'}}></i></div>
      ${notes?html`<aside className="notes" aria-label="Notas do apresentador"><p className="lbl">Notas · ${pad(cur+1)} · ${SLIDES[cur].t}</p><p>${SLIDES[cur].nt}</p></aside>`:null}
      <nav className="ctrl" aria-label="Navegação">
        <button onClick=${()=>setMenu(m=>!m)} aria-expanded=${menu}>Capítulos</button><button onClick=${()=>setNotes(m=>!m)} aria-expanded=${notes}>Notas</button><span className="sep"></span>
        <button onClick=${prev} aria-label="Anterior">←</button><span className="tab" aria-live="polite">${pad(cur+1)} / ${N}</span><button onClick=${next} aria-label="Próximo">→</button><span className="sep"></span>
        <button onClick=${restart}>Reiniciar</button><button onClick=${()=>setStatic(true)}>Estática</button><button onClick=${toggleFs}>Tela cheia</button>
      </nav>
      ${menu?html`<div className="overlay" role="dialog" aria-label="Capítulos">
        <div className="top"><span>MUB 2027 · Índice</span><button onClick=${()=>setMenu(false)}>Fechar · Esc</button></div>
        <h2>Capítulos</h2>
        <div className="chs">${CHAPTERS.map(([n,t],c)=>html`<div key=${n}><p className="cn">Capítulo ${n}</p><p className="ct">${t}</p>
          ${SLIDES.map((s,i)=>s.ch===c?html`<button key=${i} className=${i===cur?'cur':''} onClick=${()=>go(i)}><span className="tab">${pad(i+1)}</span>${s.t}</button>`:null)}</div>`)}</div>
        <p className="keys"><span><b>← →</b> navegar e revelar etapas</span><span><b>C</b> capítulos</span><span><b>N</b> notas</span><span><b>F</b> tela cheia</span><span><b>R</b> reiniciar</span></p>
      </div>`:null}
    </div></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body></html>
